# BenQ ScreenBar HALO 2 via a BM5602-60-1 on an ESP32 dev board (ESP-WROOM-32).
# Wiring and background: README.md
substitutions:
  # Test build: esphome -s self_test true -s wifi_reboot_timeout 0s run screenbar-halo2.yaml
  self_test: "false"
  wifi_reboot_timeout: 15min

esphome:
  name: screenbar-halo2
  friendly_name: ScreenBar
  min_version: 2026.10.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [halo2]

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  reboot_timeout: ${wifi_reboot_timeout}
  ap:
    ssid: "ScreenBar Recovery"
    password: !secret fallback_password

captive_portal:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  # Encrypted with the API key
  - platform: esphome
    encryption:

# VSPI pins, but SDIO on GPIO22: not every board breaks out GPIO23
# (the ESP32 SPI matrix routes any signal to any pin, no drawback at 1 MHz)
spi:
  clk_pin: GPIO18   # SCK  (BM5602 Pad 5)
  mosi_pin: GPIO22  # SDIO (BM5602 Pad 7)
  miso_pin: GPIO19  # GIO2 (BM5602 Pad 6)

halo2:
  id: screenbar
  cs_pin: GPIO5     # CSN  (BM5602 Pad 4)
  # Address of your own lamp (register order), found with kuzmin-no's find_halo2_address.py
  radio_address: [0xB1, 0xF6, 0xA8, 0xAB]
  radio_channel: 5
  self_test: ${self_test}
  light:
    id: screenbar_light
    # Empty name: the light entity takes the device name in HA ("ScreenBar").
    name: ""
    icon: mdi:wall-sconce-flat
  front_brightness:
    id: front_brightness
    name: "Front brightness"
    initial_value: 78
  back_brightness:
    id: back_brightness
    name: "Back brightness"
    icon: mdi:wall-sconce-flat-outline
    initial_value: 10
  sections:
    id: lamp_sections
    name: "Lighting"
  ultrasonic:
    id: ultrasonic_sensor
    name: "Presence sensor"
  auto_button:
    name: "Auto brightness"
  radio_status:
    id: radio_status
    name: "Radio status"
  radio_address_sensor:
    name: "Radio address"

button:
  - platform: template
    name: "Resend state"
    entity_category: diagnostic
    on_press:
      - lambda: id(screenbar).resend();
  - platform: restart
    name: "Restart"

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
